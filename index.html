<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoopBoard</title>
    <script>
      // Sets the theme before first paint so a reload never flashes the wrong one.
      // Mirrors resolveTheme/readTheme in src/theme.ts (src/theme.test.ts runs this script).
      (function () {
        var choice = 'system';
        try {
          choice = localStorage.getItem('loopboard:theme') || choice;
        } catch (e) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
